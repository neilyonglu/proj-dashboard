name: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME in the server .env}

services:
  dashboard:
    image: proj-dashboard
    container_name: proj-dashboard
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Taipei
      HOST: 0.0.0.0
      PORT: "5001"
    ports:
      - "${DASHBOARD_PORT:?Set an unused DASHBOARD_PORT in the server .env}:5001"
    volumes:
      - ./data/instance:/app/instance
      - ./data/avatars:/app/static/avatars
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/', timeout=4).close()"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

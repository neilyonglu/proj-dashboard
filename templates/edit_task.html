{% extends 'base.html' %}

{% block title %}編輯工作紀錄{% endblock %}

{% block content %}
<div class="relative flex flex-1 w-full flex-col overflow-x-hidden">
    <div class="layout-container flex h-full grow flex-col">
        <div class="px-4 sm:px-6 lg:px-10 flex flex-1 justify-center py-6 sm:py-10">
            <div
                class="layout-content-container panel flex flex-col w-full max-w-[800px] min-w-0 flex-1 p-4 sm:p-8 lg:p-10">

                <div class="flex items-center gap-2 mb-6">
                    <span class="material-symbols-outlined text-ink-muted text-sm">arrow_back</span>
                    <a class="text-sm text-ink-muted hover:text-primary transition-colors font-medium"
                        href="{{ redirect_to }}">返回</a>
                </div>

                <div class="flex flex-wrap justify-between gap-3 mb-8">
                    <h1 class="text-ink text-2xl font-semibold leading-tight tracking-tight">編輯工作紀錄
                    </h1>
                </div>


                <form class="flex flex-col gap-6" method="POST" action="{{ url_for('edit_task', id=task.id) }}">
                    <input type="hidden" name="redirect_to" value="{{ redirect_to }}" />

                    <div class="w-full">
                        <label class="flex flex-col">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-ink text-sm font-semibold">參與人員 <span
                                        class="text-red-500">*</span></span>
                            </div>
                            <div class="relative" data-combobox data-required>
                                <input type="hidden" name="personnel" value="{{ task.personnel }}">
                                <input type="text" class="combo-input input"
                                    placeholder="輸入關鍵字篩選或點選參與人員" autocomplete="off">
                                <ul class="combo-list hidden">
                                    {% for p in personnel_list %}
                                    <li class="combo-option" data-value="{{ p.name }}" data-label="{{ p.name }}">{{ p.name }}{% if p.resigned_date %} <span class="text-rose-500 text-xs">已辭職 {{ p.resigned_date.strftime('%Y/%m/%d') }}</span>{% endif %}</li>
                                    {% endfor %}
                                </ul>
                            </div>
                        </label>
                    </div>

                    <div class="w-full">
                        <label class="flex flex-col">
                            <span class="text-ink text-sm font-semibold mb-1">專案列表
                                <span class="text-red-500">*</span></span>
                            <div class="relative" data-combobox data-required>
                                <input type="hidden" name="project_id" value="{{ task.project_id }}">
                                <input type="text" class="combo-input input"
                                    placeholder="輸入關鍵字篩選或點選專案" autocomplete="off">
                                <ul class="combo-list hidden">
                                    {% for proj in projects %}
                                    <li class="combo-option" data-value="{{ proj.id }}" data-label="{{ proj.name }}">{{ proj.name }}</li>
                                    {% endfor %}
                                </ul>
                            </div>
                        </label>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div class="w-full">
                            <label class="flex flex-col">
                                <span class="text-ink text-sm font-semibold mb-2">工作日期 <span
                                        class="text-red-500">*</span></span>
                                <div class="relative flex w-full items-stretch">
                                    <input type="date" name="date" required
                                        value="{{ task.date.strftime('%Y-%m-%d') if task.date else '' }}"
                                        class="input" />
                                </div>
                            </label>
                        </div>

                        <div class="w-full">
                            <label class="flex flex-col">
                                <span class="text-ink text-sm font-semibold mb-2">工作天數 <span
                                        class="text-red-500">*</span></span>
                                <div class="relative flex w-full items-stretch">
                                    <div class="relative w-full"><input type="number" name="work_days" step="0.5" min="0.5" max="30" required
                                        value="{{ task.work_days }}"
                                        placeholder="例如：1 或 0.5"
                                        class="input" /><span class="absolute right-9 top-1/2 -translate-y-1/2 text-sm text-ink-muted pointer-events-none">天</span></div>
                                </div>
                                <span class="text-xs text-ink-muted mt-1">支援 0.5 天為單位</span>
                            </label>
                        </div>
                    </div>

                    <!-- Shift hours (optional) -->
                    <div class="w-full">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-ink text-sm font-semibold">時數明細</span>
                            <span class="text-ink-muted font-normal text-xs">(選填，可與工作天數並存)</span>
                            <span class="ml-auto text-sm text-ink-muted">合計 <span data-hours-total class="num font-semibold text-ink">0</span> hr</span>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                            <label class="flex flex-col">
                                <span class="text-ink-muted text-xs font-medium mb-1">日班時數</span>
                                <div class="relative w-full"><input type="number" name="day_hours" data-hours step="0.5" min="0" placeholder="例如：8"
                                    value="{{ task.day_hours if task.day_hours is not none else '' }}"
                                    class="input" /><span class="absolute right-9 top-1/2 -translate-y-1/2 text-sm text-ink-muted pointer-events-none">hr</span></div>
                            </label>
                            <label class="flex flex-col">
                                <span class="text-ink-muted text-xs font-medium mb-1">加班時數</span>
                                <div class="relative w-full"><input type="number" name="overtime_hours" data-hours step="0.5" min="0" placeholder="例如：2"
                                    value="{{ task.overtime_hours if task.overtime_hours is not none else '' }}"
                                    class="input" /><span class="absolute right-9 top-1/2 -translate-y-1/2 text-sm text-ink-muted pointer-events-none">hr</span></div>
                            </label>
                            <label class="flex flex-col">
                                <span class="text-ink-muted text-xs font-medium mb-1">夜班時數</span>
                                <div class="relative w-full"><input type="number" name="night_hours" data-hours step="0.5" min="0" placeholder="例如：0"
                                    value="{{ task.night_hours if task.night_hours is not none else '' }}"
                                    class="input" /><span class="absolute right-9 top-1/2 -translate-y-1/2 text-sm text-ink-muted pointer-events-none">hr</span></div>
                            </label>
                        </div>
                    </div>

                    <div class="w-full">
                        <label class="flex flex-col">
                            <span class="flex justify-between items-baseline mb-2"><span class="text-ink text-sm font-semibold">工作內容 <span
                                    class="text-red-500">*</span></span><span class="text-xs text-ink-muted"><span data-char-count="task_desc" class="num">0</span> 字</span></span>
                            <textarea id="task_desc" name="description" required
                                class="input h-auto resize-y min-h-[160px] py-2"
                                placeholder="詳細敘述工作內容...">{{ task.description }}</textarea>
                        </label>
                    </div>

                    <div class="w-full">
                        <label class="flex flex-col">
                            <span class="text-ink text-sm font-semibold mb-2">備註 <span
                                    class="text-ink-muted font-normal ml-1">(選填)</span></span>
                            <textarea name="notes"
                                class="input h-auto resize-y min-h-[100px] py-2"
                                placeholder="其他備註事項...">{{ task.notes if task.notes else '' }}</textarea>
                        </label>
                    </div>

                    <div class="flex flex-wrap justify-end gap-3 mt-8 sm:mt-10 pt-6 border-t border-line">
                        <a href="{{ redirect_to }}"
                            class="btn btn-secondary">取消</a>
                        <button type="submit"
                            class="btn btn-primary">
                            <span class="material-symbols-outlined text-[18px]">save</span>儲存修改
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
